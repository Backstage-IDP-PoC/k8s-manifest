apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-compose-apr17-test2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-compose-apr17-test2
  template:
    metadata:
      labels:
        app: docker-compose-apr17-test2
    spec:
      containers:
        - name: docker-compose-apr17-test2
          image: sureshmavp1/docker-compose-apr17-test2:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000