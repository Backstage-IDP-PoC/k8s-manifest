apiVersion: apps/v1
kind: Deployment
metadata:
  name: gssp-version-1-1-test04
  labels:
    backstage.io/kubernetes-id: gssp-version-1-1-test04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gssp-version-1-1-test04
  template:
    metadata:
      labels:
        app: gssp-version-1-1-test04
        backstage.io/kubernetes-id: gssp-version-1-1-test04
    spec:
      containers:
        - name: gssp-version-1-1-test04
          image: sureshmavp1/gssp-version-1-1-test04:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
