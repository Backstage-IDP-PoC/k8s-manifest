apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-24-apr-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonar-24-apr-05
  template:
    metadata:
      labels:
        app: sonar-24-apr-05
    spec:
      containers:
        - name: sonar-24-apr-05
          image: sureshmavp1/sonar-24-apr-05:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000