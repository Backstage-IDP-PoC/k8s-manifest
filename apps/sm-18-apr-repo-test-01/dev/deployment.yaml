apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-18-apr-repo-test-01
  namespace: dev
  labels:
    app: sm-18-apr-repo-test-01
    backstage.io/kubernetes-id: sm-18-apr-repo-test-01
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sm-18-apr-repo-test-01
  template:
    metadata:
      labels:
        app: sm-18-apr-repo-test-01
        backstage.io/kubernetes-id: sm-18-apr-repo-test-01
        environment: dev
    spec:
      containers:
        - name: sm-18-apr-repo-test-01
          image: sureshmavp1/sm-18-apr-repo-test-01:1.0.1
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"