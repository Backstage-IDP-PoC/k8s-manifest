apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sm-python-test-repo-04
  namespace: prod
  labels:
    backstage.io/kubernetes-id: sm-python-test-repo-04
    environment: prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  
  rules:
    - http:
        paths:
          - path: /sm-python-test-repo-04-prod(/|$)(.*) 
            pathType: ImplementationSpecific
            backend:
              service:
                name: sm-python-test-repo-04
                port:
                  number: 80
