apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-test-repo-01
  labels:
    backstage.io/kubernetes-id: python-test-repo-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-test-repo-01
  template:
    metadata:
      labels:
        app: python-test-repo-01
        backstage.io/kubernetes-id: python-test-repo-01
    spec:
      containers:
        - name: python-test-repo-01
          image: sureshmavp1/python-test-repo-01:1.0.9
          imagePullPolicy: Always
          ports:
            - containerPort: 5000