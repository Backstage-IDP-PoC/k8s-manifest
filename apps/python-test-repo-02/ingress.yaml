apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-test-repo-02
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2   
spec:
  rules:
    - http:
        paths:
          - path: /python-test-repo-02(/|$)(.*)               
            pathType: Prefix        
            backend:
              service:
                name: python-test-repo-02
                port:
                  number: 80
